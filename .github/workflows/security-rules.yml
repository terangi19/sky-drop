name: Security rules

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "tests/firestore-rules.test.ts"
      - "tests/storage-rules.test.ts"
      - "tests/security-launch-gates.test.ts"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-rules.yml"
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "tests/firestore-rules.test.ts"
      - "tests/storage-rules.test.ts"
      - "tests/security-launch-gates.test.ts"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run test:rules:emulator
